name: Backend CI Quality Gates

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-quality-gate:
    name: Lint, Test & Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5001
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/taskflow_test
      JWT_SECRET: ci_test_jwt_secret_key_abcdef123456

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (clean install)
        run: npm ci

      - name: Static Analysis (ESLint)
        run: npm run lint

      - name: Run Permanent Unit Tests
        run: npm run test:unit

      - name: Run Permanent Integration Tests
        run: npm run test:integration

      - name: Run Permanent System / Realtime Tests
        run: npm run test:system

      - name: Full Test Suite Coverage & Quality Gate
        run: npm run test:coverage

      - name: Upload Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage
          retention-days: 14
